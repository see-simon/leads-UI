<div class="container">

  <!-- WELCOME SECTION -->
  <div class="welcome">
    <h1>Welcome to SmartFibre</h1>
    <p>
      Explore our range of high-speed fibre and data solutions designed for
      homes and businesses. Click on any package below to learn more and
      apply online.
    </p>
  </div>

  <!-- GRID -->
  <div class="grid">
    <div class="card" *ngFor="let item of items" (click)="goToDetails(item)">
      <img [src]="item.image" [alt]="item.title" />
      <div class="card-body">
        <h3>{{ item.title }}</h3>
        <p class="speed">{{ item.speed }}</p>
        <p class="price">{{ item.price }}</p>
        <p class="description">{{ item.description }}</p>
      </div>
    </div>
  </div>

</div>
