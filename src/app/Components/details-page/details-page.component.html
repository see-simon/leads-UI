<div class="container" *ngIf="item">

  <!-- BACK BUTTON -->
  <div class="back">
    <button class="back-btn" (click)="goBack()">← Back to Packages</button>
  </div>

  <!-- HEADER -->
  <div class="header">
    <h2>{{ item.title }}</h2>
    <p class="speed">{{ item.speed }}</p>
    <p class="price">{{ item.price }}</p>
  </div>

  <!-- DETAILS CARD -->
  <div class="card">

    <img [src]="item.image" [alt]="item.title" class="package-image" />

    <div class="card-body">

      <h3>About this package</h3>
      <p class="description">{{ item.description }}</p>

      <h3>What's included</h3>
      <ul class="features">
        <li *ngFor="let feature of item.features">✅ {{ feature }}</li>
      </ul>

    </div>
  </div>

  <!-- APPLY BUTTON -->
  <div class="actions">
    <button class="apply-btn" (click)="openDialog()">
      Apply Now — Get in Touch with a Consultant
    </button>
  </div>

</div>
